<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>服务状态 · lan.bbki.ng</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface-hover: #161616;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #fafafa;
    --text-secondary: #a1a1a1;
    --text-tertiary: #666666;
    --ok: #3ecf8e;
    --warn: #f5b83d;
    --err: #f0506e;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, "SF Pro Text", Inter, "Helvetica Neue", "PingFang SC", "Noto Sans SC", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .page { max-width: 960px; margin: 0 auto; padding: 48px 24px 64px; }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; margin-bottom: 32px; flex-wrap: wrap;
  }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .overall {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .overall .dot { width: 8px; height: 8px; border-radius: 50%; }

  h2 {
    font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-tertiary);
    margin: 28px 0 12px;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    transition: border-color 200ms var(--ease-out), background 200ms var(--ease-out), transform 160ms var(--ease-out);
    cursor: default;
  }
  .card:hover { border-color: var(--border-strong); background: var(--surface-hover); }
  .card:active { transform: scale(0.98); }
  .card.down { border-color: rgba(240,80,110,0.35); }

  .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent);
    flex-shrink: 0;
  }
  .dot.down  { background: var(--err); box-shadow: 0 0 0 3px color-mix(in srgb, var(--err) 18%, transparent); }
  .dot.unk   { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 18%, transparent); }
  .card-name { font-weight: 500; font-size: 14px; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-status { margin-left: auto; font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

  .metrics { display: flex; gap: 20px; margin-bottom: 14px; }
  .metric .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .metric .l { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }

  .bars { display: flex; gap: 2px; height: 22px; align-items: flex-end; }
  .bars .b {
    flex: 1; height: 100%; border-radius: 2px;
    background: color-mix(in srgb, var(--ok) 70%, transparent);
    transition: transform 140ms var(--ease-out), opacity 140ms var(--ease-out);
    transform-origin: bottom;
  }
  .bars .b:hover { transform: scaleY(0.85); opacity: 0.8; }
  .bars .b.bad { background: color-mix(in srgb, var(--err) 70%, transparent); }
  .bars .b.none { background: var(--border); opacity: 0.5; }

  .card-foot { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

  .skeleton { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }
  .err-box {
    border: 1px solid rgba(240,80,110,0.3); border-radius: var(--radius);
    padding: 20px; color: var(--text-secondary); font-size: 13px;
    background: rgba(240,80,110,0.05);
  }
  footer { margin-top: 40px; font-size: 12px; color: var(--text-tertiary); display: flex; justify-content: space-between; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--text-secondary); }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>服务状态</h1>
    <div class="overall" id="overall"><span class="dot" style="background:var(--border)"></span><span>连接中…</span></div>
  </header>
  <main id="main"><div class="skeleton" style="height:120px;border-radius:12px;background:var(--surface)"></div></main>
  <footer>
    <span id="updated">—</span>
    <a href="https://gatus.io" target="_blank" rel="noopener">Powered by Gatus API</a>
  </footer>
</div>
<script>
const $ = (s, e=document) => e.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMs = ns => { const ms = Math.round(ns/1e6); return ms >= 1000 ? (ms/1000).toFixed(2)+'s' : ms+'ms'; };
const ago = ts => { const s = Math.floor((Date.now()-new Date(ts))/1000); return s<60 ? s+'s前' : s<3600 ? Math.floor(s/60)+'分钟前' : Math.floor(s/3600)+'小时前'; };

async function load() {
  const main = $('#main');
  try {
    const r = await fetch('/api/v1/endpoints/statuses', { cache: 'no-store' });
    if (!r.ok) throw new Error('API '+r.status);
    const data = await r.json();
    render(Array.isArray(data) ? data : (data.endpoints || []));
  } catch (e) {
    main.innerHTML = '<div class="err-box">无法读取 Gatus API（'+esc(e.message)+'）。探测服务可能在重启，稍后自动重试。</div>';
  }
}

function epStats(ep) {
  const rs = (ep.results || []).slice().sort((a,b) => new Date(a.timestamp)-new Date(b.timestamp));
  const last = rs[rs.length-1];
  const okN = rs.filter(x => x.success).length;
  const uptime = rs.length ? (okN/rs.length*100) : null;
  const avg = rs.length ? rs.reduce((s,x)=>s+(x.duration||0),0)/rs.length : 0;
  return { rs, last, uptime, avg, up: last ? !!last.success : null };
}

function card(ep) {
  const { rs, last, uptime, avg, up } = epStats(ep);
  const down = up === false;
  const status = up === null ? '无数据' : (up ? '正常' : '异常');
  const dotCls = up === null ? 'unk' : (up ? '' : 'down');
  const segs = Array.from({length: 60}, (_, i) => {
    const r = rs[rs.length-60+i];
    const cls = r === undefined ? 'none' : (r.success ? '' : 'bad');
    const t = r ? `${new Date(r.timestamp).toLocaleTimeString()} · ${r.success?'✓':'✗'} ${fmtMs(r.duration||0)}` : '';
    return `<div class="b ${cls}" title="${esc(t)}"></div>`;
  }).join('');
  return `<div class="card${down?' down':''}">
    <div class="card-top">
      <span class="dot ${dotCls}"></span>
      <span class="card-name">${esc(ep.name)}</span>
      <span class="card-status">${status}</span>
    </div>
    <div class="metrics">
      <div class="metric"><div class="v">${uptime===null?'—':uptime.toFixed(1)+'%'}</div><div class="l">可用率</div></div>
      <div class="metric"><div class="v">${rs.length?fmtMs(avg):'—'}</div><div class="l">平均延迟</div></div>
      <div class="metric"><div class="v">${last?fmtMs(last.duration||0):'—'}</div><div class="l">最近</div></div>
    </div>
    <div class="bars">${segs}</div>
    <div class="card-foot"><span>${rs.length?ago(rs[rs.length-1].timestamp):'—'}</span><span>60次探测</span></div>
  </div>`;
}

function render(eps) {
  const groups = {};
  for (const ep of eps) (groups[ep.group||'服务'] ??= []).push(ep);
  const all = eps.map(epStats);
  const up = all.filter(s => s.up === true).length, down = all.filter(s => s.up === false).length;
  $('#overall').innerHTML = down
    ? `<span class="dot down"></span><span>${down} 项异常 · ${up}/${eps.length} 在线</span>`
    : `<span class="dot"></span><span>全部正常 · ${up}/${eps.length} 在线</span>`;
  $('#main').innerHTML = Object.entries(groups).map(([g, list]) =>
    `<h2>${esc(g)}</h2><div class="grid">${list.map(card).join('')}</div>`).join('');
  $('#updated').textContent = '更新于 ' + new Date().toLocaleTimeString();
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
