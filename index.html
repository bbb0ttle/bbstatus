<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>服务状态 · lan.bbki.ng</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%9F%A2%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0a0a;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.16);
    --text: #fafafa;
    --text-secondary: #a1a1a1;
    --text-tertiary: #666666;
    --ok: #3ecf8e;
    --warn: #f5b83d;
    --err: #f0506e;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, "SF Pro Text", Inter, "Helvetica Neue", "PingFang SC", "Noto Sans SC", sans-serif;
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .page { max-width: 760px; margin: 0 auto; padding: 64px 24px 64px; }

  header { margin-bottom: 48px; }
  .brand { font-size: 13px; color: var(--text-tertiary); margin-bottom: 12px; }
  .overall {
    display: flex; align-items: center; gap: 10px;
    font-size: 20px; font-weight: 600; letter-spacing: -0.02em;
  }
  .overall .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  h2 {
    font-size: 12px; font-weight: 500; letter-spacing: 0.06em;
    color: var(--text-tertiary);
    margin: 36px 0 4px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .row-name { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .row-lat { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
  .row-status { font-size: 12px; color: var(--text-secondary); min-width: 64px; text-align: right; }
  .row-status.ok  { color: var(--ok); }
  .row-status.bad { color: var(--err); }
  .row-status.unk { color: var(--warn); }

  .bars { display: flex; gap: 1.5px; height: 26px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .row:last-child, .bars:last-of-type { border-bottom: none; }
  .bars .b {
    flex: 1; border-radius: 1px;
    background: var(--ok); opacity: 0.75;
    transition: opacity 120ms var(--ease-out);
  }
  .bars .b:hover { opacity: 1; }
  .bars .b.bad { background: var(--err); }
  .bars .b.none { background: var(--border-strong); opacity: 0.3; }
  .bars-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-tertiary); margin-top: -8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }

  .skeleton { animation: pulse 1.6s ease-in-out infinite; height: 90px; border-radius: 8px; background: rgba(255,255,255,0.04); }
  @keyframes pulse { 50% { opacity: 0.5; } }
  .err-box {
    border: 1px solid rgba(240,80,110,0.3); border-radius: 8px;
    padding: 20px; color: var(--text-secondary); font-size: 13px;
    background: rgba(240,80,110,0.05);
  }
  footer {
    margin-top: 56px; padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-tertiary);
    display: flex; justify-content: space-between;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--text-secondary); }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="brand">lan.bbki.ng</div>
    <div class="overall" id="overall"><span class="dot" style="background:var(--border-strong)"></span><span>连接中…</span></div>
  </header>
  <main id="main"><div class="skeleton"></div></main>
  <footer>
    <span id="updated">—</span>
    <span>lan.bbki.ng</span>
  </footer>
</div>
<script>
const $ = (s, e=document) => e.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMs = ns => { const ms = Math.round(ns/1e6); return ms >= 1000 ? (ms/1000).toFixed(2)+'s' : ms+'ms'; };

const SEGS = 90;

async function load() {
  try {
    const r = await fetch('/api/v1/endpoints/statuses', { cache: 'no-store' });
    if (!r.ok) throw new Error('API '+r.status);
    const data = await r.json();
    render(Array.isArray(data) ? data : (data.endpoints || []));
  } catch (e) {
    $('#main').innerHTML = '<div class="err-box">无法读取 Gatus API（'+esc(e.message)+'）。探测服务可能在重启，稍后自动重试。</div>';
  }
}

function stats(ep) {
  const rs = (ep.results || []).slice().sort((a,b) => new Date(a.timestamp)-new Date(b.timestamp));
  const last = rs[rs.length-1];
  const ok = rs.filter(x => x.success).length;
  return { rs, last, uptime: rs.length ? ok/rs.length*100 : null, up: last ? !!last.success : null };
}

function row(ep) {
  const { rs, last, uptime, up } = stats(ep);
  const stCls = up === null ? 'unk' : (up ? 'ok' : 'bad');
  const stTxt = up === null ? '无数据' : (up ? '正常' : '异常');
  const lat = last && last.duration ? fmtMs(last.duration) : '—';
  const segs = Array.from({length: SEGS}, (_, i) => {
    const r = rs[rs.length-SEGS+i];
    const cls = r === undefined ? 'none' : (r.success ? '' : 'bad');
    const t = r ? `${new Date(r.timestamp).toLocaleString()} · ${r.success?'正常':'异常'} · ${fmtMs(r.duration||0)}` : '';
    return `<div class="b ${cls}" title="${esc(t)}"></div>`;
  }).join('');
  const up2 = uptime === null ? '—' : uptime.toFixed(1)+'% 可用率';
  return `<div class="row">
      <span class="row-name">${esc(ep.name)}</span>
      <span class="row-right"><span class="row-lat">${lat}</span><span class="row-status ${stCls}">${stTxt}</span></span>
    </div>
    <div class="bars">${segs}</div>
    <div class="bars-meta"><span>${up2}</span><span>最近 ${Math.min(rs.length,SEGS)} 次探测</span></div>`;
}

function render(eps) {
  const groups = {};
  for (const ep of eps) (groups[ep.group||'服务'] ??= []).push(ep);
  const st = eps.map(stats);
  const down = st.filter(s => s.up === false).length;
  const up = st.filter(s => s.up === true).length;
  $('#overall').innerHTML = down
    ? `<span class="dot" style="background:var(--err);box-shadow:0 0 0 4px color-mix(in srgb,var(--err) 15%,transparent)"></span><span>${down} 项服务异常</span>`
    : `<span class="dot" style="background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 15%,transparent)"></span><span>全部系统正常</span>`;
  $('#main').innerHTML = Object.entries(groups).map(([g, list]) =>
    `<h2>${esc(g)}</h2>` + list.map(row).join('')).join('');
  $('#updated').textContent = '更新于 ' + new Date().toLocaleTimeString() + ' · 每 30s';
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
